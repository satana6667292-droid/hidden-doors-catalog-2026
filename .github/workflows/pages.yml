name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate editor scripts
        run: |
          node --check editor-pre.js
          node --check editor-v4.js
          node --check editor-media.js

      - name: Assemble catalog site
        run: |
          cat bundle/site-bundle.part* > /tmp/site-bundle.zip
          mkdir -p /tmp/unpacked _site
          unzip -q /tmp/site-bundle.zip -d /tmp/unpacked
          cp -a /tmp/unpacked/hidden-doors-catalog-2026-site/. _site/

          # Approved/corrected page assets.
          for n in 002 003 004 005 028 032; do
            cat page-overrides/page-${n}.b64.part* | base64 -d > "/tmp/page-${n}.webp"
            cp "/tmp/page-${n}.webp" "_site/assets/pages/page-${n}.webp"
            cp "/tmp/page-${n}.webp" "_site/assets/thumbs/page-${n}.webp"
          done

          # LOGO MASTER pilot: use the actual ARC page 19 logo raster as the exact size/placement reference.
          python3 -m pip install --quiet Pillow
          python3 scripts/bake_logo_master.py --site _site

          # The viewer already provides the canonical black page number below
          # every sheet. Remove every printed/internal folio from the page art.
          python3 scripts/remove_all_internal_folios.py --site _site
          python3 scripts/audit_catalog_footer.py --site _site

          # Build full-catalog visual QA sheets on every deploy. These are
          # inspected before a catalog change is handed back for review.
          python3 scripts/build_catalog_contact_sheets.py --site _site

          # Keep the old application only as the internal editor entrypoint.
          cp _site/index.html _site/editor.html
          cp catalog-master.js editor-pre.js editor-v4.js editor-media.js visual-fixes.js resolved-corrections.js public-view.js public-view.css public-index.html _site/

          python3 - <<'PY'
          from pathlib import Path
          p=Path("_site/editor.html")
          s=p.read_text()
          s=s.replace(
              '<script src="app.js"></script>',
              '<script src="catalog-master.js?v=master20"></script>\n'
              '  <script src="editor-pre.js?v=master20"></script>\n'
              '  <script src="app.js"></script>\n'
              '  <script src="resolved-corrections.js?v=master20"></script>\n'
              '  <script src="editor-v4.js?v=master20"></script>\n'
              '  <script src="editor-media.js?v=master20"></script>\n'
              '  <script src="visual-fixes.js?v=master20"></script>'
          )
          p.write_text(s)
          Path("_site/index.html").write_text(Path("public-index.html").read_text())
          PY

          test -s _site/index.html
          test -s _site/editor.html
          test -s _site/catalog-master.js
          test -s _site/assets/pages/page-032.webp
          test -s _site/_qa/contact-01.webp
          test -s _site/_qa/footer-audit.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
