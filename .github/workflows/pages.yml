name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble catalog site
        run: |
          cat bundle/site-bundle.part* > /tmp/site-bundle.zip
          mkdir -p /tmp/unpacked _site
          unzip -q /tmp/site-bundle.zip -d /tmp/unpacked
          cp -a /tmp/unpacked/hidden-doors-catalog-2026-site/. _site/
          cp editor-pre.js editor-v2.js visual-fixes.js _site/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("_site/index.html")
          s=p.read_text()
          s=s.replace('<script src="app.js"></script>', '<script src="editor-pre.js"></script>\n  <script src="app.js"></script>\n  <script src="editor-v2.js"></script>\n  <script src="visual-fixes.js"></script>')
          p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
