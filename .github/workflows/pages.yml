name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble catalog site
        run: |
          cat bundle/site-bundle.part* > /tmp/site-bundle.zip
          mkdir -p /tmp/unpacked _site
          unzip -q /tmp/site-bundle.zip -d /tmp/unpacked
          cp -a /tmp/unpacked/hidden-doors-catalog-2026-site/. _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
